<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClockTime33</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Quicksand:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/widgets.css">
</head>
<body>
<div class="scene" id="scene">

    <!-- Sky layers -->
    <div class="sky-atmo sky-radial" id="skyRadial"></div>
    <div class="sky-atmo sky-haze" id="skyHaze"></div>
    <div class="season-tint" id="seasonTint"></div>

    <!-- Light rays -->
    <div class="sky-atmo light-rays" id="lightRays">
        <div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div>
        <div class="ray r4"></div><div class="ray r5"></div><div class="ray r6"></div>
    </div>

    <!-- Stars & Particles -->
    <canvas id="starsCanvas"></canvas>
    <canvas id="particlesCanvas"></canvas>
    <div id="shootingStars"></div>

    <!-- Seasonal Particles (Leaves/Snow) -->
    <canvas id="seasonCanvas" class="season-canvas"></canvas>

    <!-- Celestial -->
    <div class="cel sun-wrap" id="sunWrap">
        <div class="sun-flare"></div><div class="sun-outer"></div><div class="sun-body"></div><div class="sun-inner"></div>
    </div>
    <div class="cel moon-wrap" id="moonWrap">
        <div class="moon-halo"></div><div class="moon-body"></div>
    </div>
    <div class="horizon-glow" id="horizonGlow"></div>

    <!-- ========== WEATHER WIDGET ========== -->
    <div class="weather-widget hideable" id="weatherWidget">
        <div class="weather-icon" id="weatherIcon">☀️</div>
        <div class="weather-info">
            <div class="weather-temp" id="weatherTemp">--°C</div>
            <div class="weather-desc" id="weatherDesc">Loading...</div>
            <div class="weather-city" id="weatherCity">--</div>
        </div>
    </div>

    <!-- ========== LAYERED MOUNTAINS (SHARP PEAKS) ========== -->
    <svg class="land-layer l1" viewBox="0 0 1440 280" preserveAspectRatio="none">
        <defs><linearGradient id="g-l1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" class="stop-p1"/><stop offset="100%" class="stop-b1"/></linearGradient></defs>
        <path d="M-50,280 L-50,120 L60,40 L180,140 L300,30 L450,130 L620,20 L800,150 L1020,40 L1200,160 L1380,50 L1490,140 L1490,280 Z" fill="url(#g-l1)"/>
    </svg>
    <svg class="land-layer l2" viewBox="0 0 1440 240" preserveAspectRatio="none">
        <defs><linearGradient id="g-l2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" class="stop-p2"/><stop offset="100%" class="stop-b2"/></linearGradient></defs>
        <path d="M-50,240 L-50,110 L100,50 L250,150 L380,60 L520,160 L680,40 L850,140 L1000,50 L1150,160 L1320,60 L1490,130 L1490,240 Z" fill="url(#g-l2)"/>
    </svg>
    <svg class="land-layer l3" viewBox="0 0 1440 200" preserveAspectRatio="none">
        <defs><linearGradient id="g-l3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" class="stop-p3"/><stop offset="100%" class="stop-b3"/></linearGradient></defs>
        <path d="M-50,200 L-50,140 L120,60 L280,130 L420,50 L580,120 L750,40 L920,130 L1080,55 L1250,140 L1420,70 L1490,120 L1490,200 Z" fill="url(#g-l3)"/>
    </svg>
    <svg class="land-layer l4" viewBox="0 0 1440 160" preserveAspectRatio="none">
        <defs><linearGradient id="g-l4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" class="stop-p4"/><stop offset="100%" class="stop-b4"/></linearGradient></defs>
        <path d="M-50,160 L-50,90 L180,30 L360,110 L550,40 L720,105 L920,35 L1120,95 L1320,45 L1490,110 L1490,160 Z" fill="url(#g-l4)"/>
    </svg>
    <svg class="land-layer l5" viewBox="0 0 1440 100" preserveAspectRatio="none">
        <defs><linearGradient id="g-l5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" class="stop-p5"/><stop offset="100%" class="stop-b5"/></linearGradient></defs>
        <path d="M-50,100 L-50,50 L200,20 L450,70 L680,25 L950,65 L1220,30 L1490,75 L1490,100 Z" fill="url(#g-l5)"/>
    </svg>
    <div class="ground-base" id="groundBase"></div>

    <!-- ========== CLOCK & TIMEZONE UI ========== -->
    <div class="clock-panel hideable" id="clockPanel">
        <div class="clock-greeting" id="greeting">Good Afternoon</div>
        <div class="clock-time" id="clockTime">15:01:05</div>
        <div class="clock-date" id="clockDate">Thursday, August 27, 2026</div>

        <!-- 12h / 24h Toggle -->
        <div class="time-format-toggle hideable" id="timeFormatToggle">
            <span class="fmt-label">24H</span>
            <label class="toggle-switch">
                <input type="checkbox" id="fmt12h">
                <span class="toggle-slider"></span>
            </label>
            <span class="fmt-label">12H</span>
        </div>

        <div class="clock-location hideable" id="clockLocation">
            <span class="loc-icon">📍</span>
            <span class="loc-text" id="locText">Detecting Location...</span>
        </div>
        <div class="tz-selector hideable" id="tzSelector">
            <label for="gmtSelect">Time</label>
            <select id="gmtSelect"></select>
        </div>
    </div>

    <!-- ========== TOP-RIGHT BUTTON GROUP ========== -->
    <div class="top-btn-group">
        <button class="icon-btn focus-btn" id="focusBtn" aria-label="Focus Mode" title="Focus Mode">👁️</button>
        <button class="icon-btn todo-btn" id="todoBtn" aria-label="To-Do List" title="To-Do List">📝</button>
        <button class="icon-btn settings-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙️</button>
    </div>

    <!-- ========== SETTINGS DRAWER ========== -->
    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-drawer" id="settingsDrawer">
        <div class="settings-header">
            <h3>⚙️ Settings</h3>
            <button class="settings-close" id="settingsClose">✕</button>
        </div>
        <div class="settings-body">
            <div class="settings-item">
                <span class="settings-label">✨ Fireflies Effect</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="setFireflies" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="settings-item">
                <span class="settings-label">🌡️ Temperature Unit</span>
                <div class="settings-radio-group">
                    <label class="settings-radio"><input type="radio" name="tempUnit" value="C" checked> °C</label>
                    <label class="settings-radio"><input type="radio" name="tempUnit" value="F"> °F</label>
                </div>
            </div>
            <div class="settings-item">
                <span class="settings-label">🕐 Time Format</span>
                <div class="settings-radio-group">
                    <label class="settings-radio"><input type="radio" name="timeFormat" value="24" checked> 24H</label>
                    <label class="settings-radio"><input type="radio" name="timeFormat" value="12"> 12H</label>
                </div>
            </div>
            <div class="settings-item settings-item-col">
                <span class="settings-label">🌍 Timezone</span>
                <select id="setTimezone" class="settings-select"></select>
            </div>
        </div>
    </div>

    <!-- ========== TO-DO PANEL ========== -->
    <div class="todo-overlay" id="todoOverlay"></div>
    <div class="todo-panel" id="todoPanel">
        <div class="todo-header">
            <h3>📝 To-Do List</h3>
            <button class="todo-close" id="todoClose">✕</button>
        </div>
        <div class="todo-input-wrap">
            <input type="text" id="todoInput" placeholder="Add a task..." />
            <button class="todo-add-btn" id="todoAdd">+</button>
        </div>
        <ul class="todo-list" id="todoList"></ul>
    </div>

    <!-- ========== POMODORO TIMER ========== -->
    <div class="pomodoro-widget hideable" id="pomodoroWidget">
        <div class="pomo-header">
            <span class="pomo-title">🍅 Pomodoro</span>
            <button class="pomo-minimize" id="pomoMinimize">−</button>
        </div>
        <div class="pomo-body" id="pomoBody">
            <div class="pomo-display" id="pomoDisplay">25:00</div>
            <div class="pomo-mode">
                <button class="pomo-mode-btn active" data-mode="work">Work</button>
                <button class="pomo-mode-btn" data-mode="break">Break</button>
            </div>
            <div class="pomo-time-adjust">
                <div class="pomo-adj-group">
                    <label>Work</label>
                    <div class="pomo-adj-controls">
                        <button class="pomo-adj-btn" data-target="work" data-dir="-1">−</button>
                        <span class="pomo-adj-value" id="pomoWorkMin">25</span>
                        <span class="pomo-adj-unit">min</span>
                        <button class="pomo-adj-btn" data-target="work" data-dir="1">+</button>
                    </div>
                </div>
                <div class="pomo-adj-group">
                    <label>Break</label>
                    <div class="pomo-adj-controls">
                        <button class="pomo-adj-btn" data-target="break" data-dir="-1">−</button>
                        <span class="pomo-adj-value" id="pomoBreakMin">5</span>
                        <span class="pomo-adj-unit">min</span>
                        <button class="pomo-adj-btn" data-target="break" data-dir="1">+</button>
                    </div>
                </div>
            </div>
            <div class="pomo-controls">
                <button class="pomo-ctrl" id="pomoPlay">▶</button>
                <button class="pomo-ctrl" id="pomoPause" style="display:none">⏸</button>
                <button class="pomo-ctrl" id="pomoReset">↺</button>
            </div>
        </div>
    </div>

    <!-- ========== LOFI PLAYER ========== -->
    <div class="lofi-widget hideable" id="lofiWidget">
        <div class="lofi-header">🎵 Lofi Radio</div>
        <div class="lofi-track-name" id="lofiTrackName">Select a track</div>
        <div class="lofi-controls">
            <button class="lofi-btn lofi-prev" id="lofiPrev" title="Previous">⏮</button>
            <button class="lofi-btn" id="lofiToggle" title="Play">▶</button>
            <button class="lofi-btn lofi-next" id="lofiNext" title="Next">⏭</button>
            <input type="range" id="lofiVolume" min="0" max="100" value="50" class="lofi-volume">
        </div>
        <select id="lofiChannel" class="lofi-select">
            <option value="assets/music/Beats Lofi.mp3">Beats Lofi</option>
            <option value="assets/music/Cafe Lofi.mp3">Cafe Lofi</option>
            <option value="assets/music/Chill Lofi.mp3">Chill Lofi</option>
            <option value="assets/music/Lanterns.mp3">Lanterns</option>
            <option value="assets/music/Loop Lofi.mp3">Loop Lofi</option>
            <option value="assets/music/Tech Lofi.mp3">Tech Lofi</option>
            <option value="assets/music/Window.mp3">Window</option>
        </select>
    </div>
    </div>

</div>

<!-- Scripts (modular) -->
<script src="script.js"></script>
<script src="js/focus.js"></script>
<script src="js/pomodoro.js"></script>
<script src="js/todo.js"></script>
<script src="js/lofi.js"></script>
</body>
</html>
